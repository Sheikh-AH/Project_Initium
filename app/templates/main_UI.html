<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Initium - Main Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main_UI.css') }}">
</head>

<body>
    <div class="game-container">

        <div class="panel">
            <div class="UI-Nav-section">
                <button class="nav-button">Explore</button>
                <button class="nav-button">Inventory</button>
                <button class="nav-button">Skills</button>
            </div>
        </div>

        <div class="divider">
            <svg width="40" height="100%" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="chainPattern" x="0" y="0" width="40" height="60" patternUnits="userSpaceOnUse">
                        <!-- Outer oval -->
                        <ellipse cx="20" cy="30" rx="12" ry="22" fill="none" stroke="#131825ff" stroke-width="3"/>
                        <!-- Inner oval (hollow effect) -->
                        <ellipse cx="20" cy="30" rx="7" ry="17" fill="none" stroke="#131825ff" stroke-width="1.5"/>
                        <!-- Top connector to next link -->
                        <line x1="20" y1="0" x2="20" y2="8" stroke="#131825ff" stroke-width="3"/>
                        <!-- Bottom connector to next link -->
                        <line x1="20" y1="52" x2="20" y2="60" stroke="#131825ff" stroke-width="3"/>
                    </pattern>
                </defs>
                <rect width="40" height="100%" fill="url(#chainPattern)"/>
            </svg>
        </div>

        <div class="panel">
            <div class="actions-section">
                <p>Placeholder text</p>
            </div>
        </div>

        <div class="panel">
            <div class="info-section">
                <p>Placeholder text</p>
            </div>
        </div>

    </div>
</body>

</html>
